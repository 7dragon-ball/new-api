name: Publish Docker image (Quay.io)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quay-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: quay.io/levydotvip/new-api

jobs:
  prepare:
    name: Prepare tags
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve date tag
        id: version
        run: |
          # UTC date, e.g. 20261117. Same-day builds overwrite the same tag.
          VERSION=$(date -u +'%Y%m%d')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:${VERSION}"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Write VERSION
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          echo "Building ${{ needs.prepare.outputs.version }} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          # Robot account works too: levydotvip+ci / <robot token>
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Output digest
        run: |
          echo "### ${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Create multi-arch manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Create & push manifests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.prepare.outputs.version }}" \
            "${IMAGE}:${{ needs.prepare.outputs.version }}-amd64" \
            "${IMAGE}:${{ needs.prepare.outputs.version }}-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${{ needs.prepare.outputs.version }}-amd64" \
            "${IMAGE}:${{ needs.prepare.outputs.version }}-arm64"

      - name: Manifest summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
